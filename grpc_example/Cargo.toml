[package]
name = "grpc_example"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
gethostname = "1.1.0"
prost = "0.14.4"
rand = "0.10.1"
thousands = "0.2"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
tonic-prost-build = "*"

